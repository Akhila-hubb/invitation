<!DOCTYPE html>
<html>
<head>
    <title>Registered Users</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: #f5f5f5;
        }

        h1 {
            color: darkblue;
        }

        table {
            margin: auto;
            border-collapse: collapse;
            width: 70%;
            background: white;
        }

        th, td {
            padding: 10px;
            border: 1px solid black;
        }

        th {
            background: lightblue;
        }
    </style>
</head>

<body>

<h1>🎓 Registered Students</h1>

<table id="table">
    <tr>
        <th>Name</th>
        <th>Email</th>
        <th>Date</th>
    </tr>
</table>

<script>
fetch("http://127.0.0.1:3000/users")
.then(response => response.json())
.then(data => {
    console.log(data); // 👈 IMPORTANT (check for debugging)

    let table = document.getElementById("table");

    data.forEach(user => {
        let row = table.insertRow();

        row.insertCell(0).innerText = user.name;
        row.insertCell(1).innerText = user.email;
        row.insertCell(2).innerText = new Date(user.timestamp).toLocaleDateString();
    });
})
.catch(error => {
    console.log("Error:", error);
});
</script>

</body>
</html>
